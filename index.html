<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.L.V.A. MAINCORE</title>
    <style>
        :root { --cian: #00ffff; --cobre: #e68a00; --fondo: #050505; --neon: rgba(0, 255, 255, 0.4); }
        body { background: var(--fondo); color: #d1d1d1; font-family: 'Courier New', monospace; margin: 0; overflow-x: hidden; }
        
        /* Cabecera Futurista */
        .page-header { 
            border-bottom: 2px solid var(--cobre); padding: 40px; text-align: center;
            background: linear-gradient(to bottom, #111, var(--fondo));
            box-shadow: 0 0 20px var(--cobre);
        }
        h1 { color: var(--cian); text-shadow: 0 0 10px var(--cian); letter-spacing: 5px; margin: 0; }
        
        /* Buscador Tipo Consola */
        #buscador {
            background: #000; border: 1px solid var(--cian); color: var(--cian);
            padding: 12px; width: 350px; margin-top: 20px; font-family: monospace;
            box-shadow: 0 0 10px var(--neon); outline: none;
        }

        /* Grid de Datos */
        #grid-apuntes { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); 
            gap: 20px; padding: 40px; 
        }

        /* Tarjetas "Cyber-Panel" */
        .card { 
            border: 1px solid var(--cian); background: rgba(0, 20, 20, 0.8); 
            padding: 20px; transition: 0.3s; position: relative;
        }
        .card:hover { box-shadow: 0 0 20px var(--cian); transform: scale(1.02); }
        .card h2 { color: var(--cobre); margin-top: 0; }
        .badge { color: var(--cian); font-size: 0.7em; border: 1px solid var(--cian); padding: 2px 5px; display: inline-block; }

        /* Botones Interactivos */
        .btn { 
            background: transparent; border: 1px solid var(--cian); color: var(--cian);
            padding: 8px 15px; cursor: pointer; text-decoration: none; font-weight: bold;
        }
        .btn:hover { background: var(--cian); color: #000; box-shadow: 0 0 10px var(--cian); }

        /* Visor de PDFs */
        #visor-pdf { border: 1px solid var(--cian); background: #000; height: 600px; box-shadow: 0 0 20px var(--neon); }
    </style>
</head>
<body>
    <header class="page-header">
        <h1>[ ARCHIVO MECÁNICO S.I.L.V.A. ]</h1>
        <input type="text" id="buscador" placeholder="> ESCANEAR SISTEMA...">
    </header>

    <main id="grid-apuntes"></main>

    <script src="main.js"></script>
</body>
</html>
