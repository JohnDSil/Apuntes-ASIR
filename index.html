<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.L.V.A. QUANTUM TERMINAL</title>
    <style>
        :root { --cian: #00ffff; --cobre: #e68a00; --fondo: #020202; --rojo: #ff0055; }
        
        body { 
            background: var(--fondo); color: #d1d1d1; font-family: 'Courier New', monospace; 
            margin: 0; overflow-x: hidden;
            background-image: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
        }

        .page-header { 
            border-bottom: 4px double var(--cian); padding: 50px; text-align: center;
            background: rgba(0, 20, 20, 0.5); box-shadow: 0 0 30px rgba(0, 255, 255, 0.2);
        }

        h1 { color: var(--cian); text-shadow: 0 0 15px var(--cian); letter-spacing: 10px; font-size: 2.5em; }

        #buscador {
            background: #000; border: 2px solid var(--cobre); color: var(--cian);
            padding: 15px; width: 60%; max-width: 500px; margin-top: 30px; 
            font-family: 'Courier New', monospace; font-size: 1.2em;
            box-shadow: 0 0 15px var(--cobre); outline: none; text-transform: uppercase;
        }

        #grid-apuntes { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 30px; padding: 50px; 
        }

        .card { 
            border: 1px solid var(--cian); background: rgba(0, 10, 10, 0.9); 
            padding: 25px; transition: 0.4s; position: relative;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 85% 100%, 0 100%);
        }

        .card:hover { 
            box-shadow: 0 0 30px var(--cian); transform: translateY(-10px);
            background: rgba(0, 40, 40, 0.9);
        }

        .card h2 { color: var(--cobre); margin: 10px 0; border-bottom: 1px solid var(--cobre); }

        .btn { 
            background: transparent; border: 1px solid var(--cian); color: var(--cian);
            padding: 10px 20px; cursor: pointer; font-weight: bold; width: 100%;
            margin-top: 15px; transition: 0.3s;
        }

        .btn:hover { background: var(--cian); color: #000; box-shadow: 0 0 20px var(--cian); }

        #visor-pdf { border: 2px solid var(--cian); background: #000; height: 700px; }
        
        .badge { background: var(--cian); color: #000; padding: 2px 8px; font-weight: bold; font-size: 0.8em; }
    </style>
</head>
<body>
    <header class="page-header">
        <h1>> S.I.L.V.A. <br><small style="font-size: 0.4em; letter-spacing: 2px;">ADVANCED SYSTEMS INTERFACE</small></h1>
        <input type="text" id="buscador" placeholder="AGUARDANDO COMANDO...">
    </header>

    <main id="grid-apuntes"></main>

    <script src="main.js"></script>
</body>
</html>
