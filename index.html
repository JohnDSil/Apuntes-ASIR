<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.L.V.A. Academy // ASIR</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --bg-dark: #000000;
            --card-bg: #1a1a1a;
            --accent: #00a3ff;
            --text-main: #ffffff;
            --text-muted: #a0a0a0;
            --border: #333333;
        }

        body { 
            background-color: var(--bg-dark); 
            color: var(--text-main); 
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; 
            margin: 0; 
            -webkit-font-smoothing: antialiased;
        }

        header { 
            padding: 4rem 2rem 2rem 2rem;
            text-align: center;
            max-width: 800px;
            margin: auto;
        }

        .logo { 
            font-size: 2.5rem; 
            font-weight: 800; 
            letter-spacing: -2px; 
            margin-bottom: 1rem;
        }

        #buscador {
            background: var(--card-bg);
            border: 2px solid var(--border);
            border-radius: 12px;
            color: white;
            padding: 1rem 1.5rem;
            width: 100%;
            max-width: 500px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
            margin-top: 1rem;
        }

        #buscador:focus { border-color: var(--accent); outline: none; }

        #grid-apuntes { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 1.5rem; 
            padding: 2rem; 
            max-width: 1200px; 
            margin: auto;
        }

        .card { 
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 2rem;
            text-align: left;
            transition: transform 0.2s ease, border-color 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card:hover { 
            transform: translateY(-5px);
            border-color: var(--accent);
        }

        .card h2 { margin: 0 0 0.75rem 0; font-size: 1.5rem; font-weight: 700; }
        .card p { color: var(--text-muted); font-size: 1rem; line-height: 1.5; margin-bottom: 2rem; }

        .btn { 
            background: var(--accent); 
            color: #fff; 
            border: none; 
            padding: 0.8rem 1.5rem; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: 700; 
            font-size: 0.9rem;
            width: fit-content;
        }

        /* Estilo Dashboard "MoureDev" */
        .dashboard-container { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }
        .sidebar { background: var(--bg-dark); border-right: 1px solid var(--border); padding: 2rem; }
        .unit-item { 
            padding: 1rem; 
            margin-bottom: 0.75rem; 
            border-radius: 12px; 
            cursor: pointer; 
            background: var(--card-bg);
            border: 1px solid var(--border);
            transition: 0.2s;
        }
        .unit-item:hover { border-color: var(--accent); color: var(--accent); }
        #visor-pdf { background: #121212; position: relative; }
    </style>
</head>
<body>
    <header>
        <div class="logo">S.I.L.V.A.<span style="color:var(--accent)">.</span></div>
        <p style="color:var(--text-muted)">Apuntes de ASIR 1º - Repositorio de Ingeniería de Sistemas</p>
        <input type="text" id="buscador" placeholder="Buscar asignatura o comando...">
    </header>
    <main id="grid-apuntes"></main>
    <script src="main.js"></script>
</body>
</html>
