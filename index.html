<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="icon" href="data:,">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.L.V.A. QUANTUM TERMINAL</title>
    <style>
    :root {
        --bg-main: #0f172a;      /* Azul pizarra muy oscuro */
        --bg-card: #1e293b;      /* Azul pizarra grisáceo */
        --accent: #38bdf8;       /* Cian suave profesional */
        --accent-alt: #818cf8;   /* Violeta suave para GBD/ISO */
        --text-main: #f1f5f9;    /* Blanco roto */
        --text-muted: #94a3b8;   /* Gris para detalles */
        --success: #22c55e;
    }

    body {
        background-color: var(--bg-main);
        color: var(--text-main);
        font-family: 'Inter', -apple-system, sans-serif; /* Más moderno que Courier */
        margin: 0;
        line-height: 1.6;
    }

    /* Cabecera Limpia */
    .page-header {
        background: rgba(15, 23, 42, 0.8);
        backdrop-filter: blur(10px); /* Efecto cristalino */
        border-bottom: 1px solid rgba(255,255,255,0.1);
        padding: 30px 20px;
        position: sticky; top: 0; z-index: 1000;
        text-align: center;
    }

    h1 { 
        margin: 0; font-size: 1.8rem; letter-spacing: -0.5px; 
        background: linear-gradient(90deg, var(--accent), var(--accent-alt));
        -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }

    /* Buscador Moderno */
    #buscador {
        background: var(--bg-card);
        border: 1px solid rgba(255,255,255,0.1);
        color: white;
        padding: 12px 20px;
        width: 100%; max-width: 600px;
        border-radius: 8px;
        margin-top: 20px;
        font-size: 1rem;
        transition: 0.3s;
    }

    #buscador:focus {
        border-color: var(--accent);
        outline: none;
        box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
    }

    /* Grid Organizado */
    #grid-apuntes {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 24px;
        padding: 40px;
        max-width: 1400px; margin: auto;
    }

    /* Tarjetas Tipo SaaS */
    .card {
        background: var(--bg-card);
        border: 1px solid rgba(255,255,255,0.05);
        border-radius: 12px;
        padding: 24px;
        transition: transform 0.2s, box-shadow 0.2s;
        display: flex; flex-direction: column;
    }

    .card:hover {
        transform: translateY(-4px);
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        border-color: rgba(255,255,255,0.1);
    }

    .badge {
        font-size: 0.75rem; font-weight: 600;
        text-transform: uppercase; letter-spacing: 0.05em;
        color: var(--accent); margin-bottom: 8px;
    }

    .btn {
        background: var(--accent);
        color: var(--bg-main);
        border: none; border-radius: 6px;
        padding: 10px; font-weight: 600;
        cursor: pointer; margin-top: auto;
        transition: filter 0.2s;
    }

    .btn:hover { filter: brightness(1.1); }

    /* Visor mejorado */
    #visor-pdf {
        background: #111;
        border-radius: 8px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.1);
    }
</style>
</head>
<body>
    <header class="page-header">
        <h1>> S.I.L.V.A. <br><small style="font-size: 0.4em; letter-spacing: 2px;">ADVANCED SYSTEMS INTERFACE</small></h1>
        <input type="text" id="buscador" placeholder="AGUARDANDO COMANDO...">
    </header>

    <main id="grid-apuntes"></main>

    <script src="main.js"></script>
</body>
</html>
