<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>S.I.L.V.A. Enterprise - Management Console</title>
    <link rel="icon" href="data:,">
    <style>
        :root {
            --brand-primary: #0ea5e9;
            --brand-dark: #0f172a;
            --surface: #1e293b;
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body { 
            background-color: var(--brand-dark); 
            color: var(--text-main); 
            font-family: 'Segoe UI', system-ui, sans-serif; 
            margin: 0; 
        }

        /* Top Navigation Bar */
        header { 
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000;
        }

        .brand-logo { font-weight: 800; font-size: 1.2rem; letter-spacing: -1px; color: var(--brand-primary); }

        #buscador {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: white;
            padding: 0.6rem 1rem;
            width: 300px;
            transition: 0.3s;
        }

        #buscador:focus { border-color: var(--brand-primary); outline: none; background: rgba(255, 255, 255, 0.1); }

        /* Main Grid */
        #grid-apuntes { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); 
            gap: 1.5rem; padding: 3rem; max-width: 1400px; margin: auto;
        }

        .card { 
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem;
            transition: all 0.2s ease;
        }

        .card:hover { 
            border-color: var(--brand-primary);
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.15);
            transform: translateY(-2px);
        }

        .card h2 { margin: 0 0 0.5rem 0; font-size: 1.25rem; font-weight: 600; }
        .card p { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem; }

        .btn { 
            background: var(--brand-primary); 
            color: #fff; border: none; 
            padding: 0.7rem 1.2rem; border-radius: 4px; 
            cursor: pointer; font-weight: 600; font-size: 0.85rem;
            transition: opacity 0.2s;
        }

        .btn:hover { opacity: 0.9; }

        /* Dashboard View */
        .dashboard-container { display: grid; grid-template-columns: 280px 1fr; gap: 1px; background: var(--border); height: calc(100vh - 70px); }
        .sidebar { background: var(--brand-dark); padding: 1.5rem; overflow-y: auto; }
        .unit-item { 
            padding: 0.8rem 1rem; margin-bottom: 0.5rem; 
            border-radius: 6px; cursor: pointer; color: var(--text-muted);
            font-size: 0.9rem; transition: 0.2s;
        }
        .unit-item:hover { background: rgba(255, 255, 255, 0.05); color: var(--brand-primary); }
        #visor-pdf { background: #000; display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>
    <header>
        <div class="brand-logo">S.I.L.V.A. // ENTERPRISE</div>
        <input type="text" id="buscador" placeholder="Search resources...">
    </header>
    <main id="grid-apuntes"></main>
    <script src="main.js"></script>
</body>
</html>
